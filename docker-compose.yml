services:
  bci:
    build: .
    volumes:
      - .:/app
      # ホストのデータセットディレクトリをマウント (Read-Only)
      - /home/kawamura/bci_project/braindecodetest:/mnt/bci_source:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    tty: true
    stdin_open: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_HOST=http://host.docker.internal:11434