services:
  bci:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-bci-llm:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - .:/app
      # ホストのデータセットディレクトリをマウント (Read-Only)
      - /home/kawamura/bci_project/braindecodetest:/mnt/bci_source:ro
      # ホストで pull した Ollama モデルをコンテナ内にマウント（読み取り専用）
      # Mount under /mnt so non-root container user can access it
      - /usr/share/ollama/.ollama:/mnt/ollama:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    tty: true
    stdin_open: true
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - WORKSPACE_DIR=/tmp/agent_workspace
      - TARGET_PYTHON=python
      - OLLAMA_MODELS=/mnt/ollama
      - OLLAMA_HOST=127.0.0.1:11434
      - MLFLOW_TRACKING_URI=file:///tmp/mlruns
      - MPLCONFIGDIR=/tmp/matplotlib
    user: "10151:200"
    # Using host networking so extra_hosts is not required

  mlflow_server:
    image: ghcr.io/mlflow/mlflow
    ports:
      - "5000:5000"
    command: >
      mlflow server --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root /mlruns
      --host 0.0.0.0 --port 5000
    volumes:
      - mlflow_data:/mlflow
      - mlruns:/mlruns

volumes:
  mlflow_data:
  mlruns: